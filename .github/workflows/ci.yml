name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch: # permet de lancer manuellement les E2E (voir job e2e-tests)

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        # Bloque uniquement sur les vulnérabilités « critical ». Les alertes
        # « high » restantes concernent des dépendances (react-router, etc.)
        # dont le seul correctif est une montée de version majeure/pré-release
        # à traiter séparément — elles ne doivent pas bloquer la CI en l'état.
        run: npm audit --audit-level=critical

      - name: Run linter
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run type check
        run: npm run typecheck

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage/coverage-final.json
          fail_ci_if_error: false

  migrate:
    name: Supabase Migrations
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # Ne bloque pas la CI quand les secrets Supabase ne sont pas configurés
    # (le contexte `secrets` étant interdit dans un `if:`, on passe par env).
    # `supabase link` exige AUSSI un access token : on garde le job à condition
    # que les trois secrets soient présents, sinon les étapes sont sautées et le
    # job reste vert.
    env:
      HAS_SUPABASE: ${{ secrets.SUPABASE_PROJECT_REF != '' && secrets.SUPABASE_DB_PASSWORD != '' && secrets.SUPABASE_ACCESS_TOKEN != '' }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Supabase CLI
        run: npm install -g supabase

      - name: Link Supabase project
        if: env.HAS_SUPABASE == 'true'
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} -p ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Push migrations
        if: env.HAS_SUPABASE == 'true'
        run: supabase db push -p ${{ secrets.SUPABASE_DB_PASSWORD }}

  build:
    name: Build
    runs-on: ubuntu-latest
    # NB : ne dépend que de lint-and-test. Le job `migrate` ne s'exécute que
    # sur push vers main ; l'inclure dans `needs` faisait « sauter » (skip) le
    # build — et donc les E2E — sur toutes les PR (un `needs` sauté se propage).
    # Le build/les E2E n'ont de toute façon aucune dépendance sur `migrate`.
    needs: [lint-and-test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: build
    # Les E2E tournent contre un VRAI backend Supabase démarré localement dans
    # le runner (`supabase start`) : Postgres + Auth + Storage + API, avec les
    # migrations de `supabase/migrations` appliquées. Aucun secret externe n'est
    # requis — la stack locale génère son URL et sa clé anon, qu'on injecte dans
    # le serveur de dev via les variables VITE_*.
    # Réactivé sur push/PR (le garde `workflow_dispatch` est retiré).

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase (backend de test local)
        # Démarre la stack complète et applique les migrations. La commande
        # bloque jusqu'à ce que les services soient sains : le backend est donc
        # prêt avant l'exécution des tests.
        run: supabase start

      - name: Exposer l'URL et la clé anon du backend local
        # `--override-name` produit les variables attendues par l'app (voir
        # src/lib/supabase.ts). ATTENTION : `-o env` entoure les valeurs de
        # guillemets (VITE_SUPABASE_URL="http://127.0.0.1:54321"), et
        # `>> $GITHUB_ENV` les conserve LITTÉRALEMENT — l'app recevait donc une
        # URL entre guillemets, rejetée par @supabase/supabase-js
        # (« Invalid supabaseUrl »), ce qui faisait planter createClient au
        # chargement → page blanche. On retire donc les guillemets et on ne
        # garde que les deux variables VITE_ utiles.
        run: |
          supabase status -o env \
            --override-name api.url=VITE_SUPABASE_URL \
            --override-name auth.anon_key=VITE_SUPABASE_ANON_KEY \
            | grep -E '^VITE_' \
            | sed -E 's/^([A-Za-z_][A-Za-z0-9_]*)="(.*)"$/\1=\2/' \
            >> "$GITHUB_ENV"

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        # La config déclare 5 projets ; on restreint à chromium (seul navigateur
        # installé) pour un job rapide et fiable. Le serveur de dev démarré par
        # Playwright (webServer) hérite des variables VITE_* ci-dessus.
        run: npx playwright test --project=chromium
        env:
          CI: true
          # Vrai backend : on désactive explicitement le mode mock.
          VITE_MOCK_MODE: 'false'

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
